<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mango Network</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #e07b00; --accent-ink: #fff; --danger: #c62828; --ok: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --panel: #1c2028; --text: #e8eaf0; --muted: #9aa3b5; --line: #2b303b; --accent: #f59a2b; --accent-ink: #1a1200; --danger: #ef6a6a; --ok: #66bb6a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
  aside { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 20px 12px; }
  aside h1 { font-size: 16px; margin: 0 8px 16px; display: flex; gap: 8px; align-items: center; }
  aside h1 span { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; }
  .account { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 10px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
  .account:hover { background: var(--bg); }
  .account.active { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
  .account b { display: block; }
  .account small { color: var(--muted); }
  main { flex: 1; padding: 28px 32px; min-width: 0; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h2 { margin: 0; font-size: 22px; }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card strong { display: block; font-size: 26px; }
  .card span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: 10px 14px; cursor: pointer; font: inherit; border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.link { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 2px 6px; }
  button.link.danger { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.id { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
  td.actions { white-space: nowrap; text-align: right; }
  .empty { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(480px, 94vw); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  form { padding: 20px; display: grid; gap: 12px; }
  form h3 { margin: 0 0 4px; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .error { color: var(--danger); min-height: 1.2em; font-size: 13px; }
  @media (max-width: 760px) { body { flex-direction: column; } aside { width: auto; border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 20px 16px; } }
</style>
</head>
<body>
<aside>
  <h1><span></span> Mango Network</h1>
  <div id="accounts"></div>
</aside>
<main>
  <header><h2 id="title"></h2><span class="chip" id="stage"></span></header>
  <div class="cards">
    <div class="card"><strong id="n-sub">0</strong><span>Sub-actors</span></div>
    <div class="card"><strong id="n-fac">0</strong><span>Facilities</span></div>
    <div class="card"><strong id="n-owned">0</strong><span>Owned by a sub-actor</span></div>
    <div class="card"><strong id="n-own">0</strong><span>Account sites</span></div>
  </div>
  <div class="tabs">
    <button data-tab="sub" class="active">Sub-actors</button>
    <button data-tab="fac">Facilities</button>
  </div>
  <div class="bar"><button class="primary" id="add"></button></div>
  <div id="list"></div>
</main>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>

<script>
const $ = (s) => document.querySelector(s);
const state = { accounts: [], account: null, tab: 'sub', subs: [], facs: [] };

async function api(method, path, body) {
  const res = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function loadAccounts() {
  state.accounts = await api('GET', '/accounts');
  $('#accounts').innerHTML = state.accounts.map((a) =>
    `<button class="account ${a.id === state.account ? 'active' : ''}" data-id="${a.id}"><b>${esc(a.name)}</b><small>${esc(a.stage)} · ${a.subActors} sub-actors · ${a.facilities} facilities</small></button>`).join('');
}

async function load() {
  const a = state.accounts.find((x) => x.id === state.account);
  $('#title').textContent = a.name;
  $('#stage').textContent = a.stage;
  [state.subs, state.facs] = await Promise.all([api('GET', `/accounts/${a.id}/sub-actors`), api('GET', `/accounts/${a.id}/facilities`)]);
  $('#n-sub').textContent = state.subs.length;
  $('#n-fac').textContent = state.facs.length;
  $('#n-owned').textContent = state.facs.filter((f) => f.subActorId).length;
  $('#n-own').textContent = state.facs.filter((f) => !f.subActorId).length;
  $('#add').textContent = state.tab === 'sub' ? '+ Add sub-actor' : '+ Add facility';
  render();
}

function render() {
  const subName = (id) => { const s = state.subs.find((x) => x.id === id); return s ? `${s.firstName} ${s.lastName}` : ''; };
  if (state.tab === 'sub') {
    $('#list').innerHTML = state.subs.length ? `<table><tr><th>Id</th><th>Name</th><th>Phone</th><th>Gender</th><th>Village</th><th></th></tr>${state.subs.map((s) =>
      `<tr><td class="id">${esc(s.id)}</td><td>${esc(s.firstName)} ${esc(s.lastName)}</td><td>${esc(s.phone)}</td><td>${esc(s.gender)}</td><td>${esc(s.village)}</td>
       <td class="actions"><button class="link" data-edit="${s.id}">Edit</button><button class="link danger" data-del="${s.id}">Delete</button></td></tr>`).join('')}</table>`
      : '<div class="empty">No sub-actors yet.</div>';
  } else {
    $('#list').innerHTML = state.facs.length ? `<table><tr><th>Id</th><th>Name</th><th>Owner</th><th>Details</th><th>Position</th><th></th></tr>${state.facs.map((f) =>
      `<tr><td class="id">${esc(f.id)}</td><td>${esc(f.name)}</td><td>${f.subActorId ? esc(subName(f.subActorId)) : '<span class="chip">account site</span>'}</td>
       <td>${esc([f.variety, f.plantedOn && 'planted ' + f.plantedOn, f.description].filter(Boolean).join(' · '))}</td>
       <td>${f.outline?.length >= 3 ? f.outline.length + '-point outline' : esc([f.latitude, f.longitude].filter((x) => x != null).join(', '))}</td>
       <td class="actions"><button class="link" data-edit="${f.id}">Edit</button><button class="link danger" data-del="${f.id}">Delete</button></td></tr>`).join('')}</table>`
      : '<div class="empty">No facilities yet.</div>';
  }
}

function openForm(record) {
  const editing = !!record;
  const f = $('#form');
  if (state.tab === 'sub') {
    const r = record ?? {};
    f.innerHTML = `<h3>${editing ? 'Edit' : 'Add'} sub-actor</h3>
      <div class="row"><label>First name<input name="firstName" required value="${esc(r.firstName)}"></label><label>Last name<input name="lastName" required value="${esc(r.lastName)}"></label></div>
      <div class="row"><label>Phone<input name="phone" value="${esc(r.phone)}"></label>
        <label>Gender<select name="gender">${['', 'F', 'M'].map((g) => `<option value="${g}" ${r.gender === g ? 'selected' : ''}>${g || '—'}</option>`).join('')}</select></label></div>
      <label>Village<input name="village" value="${esc(r.village)}"></label>`;
  } else {
    const r = record ?? {};
    const outline = (r.outline ?? []).map((p) => `${p.lat},${p.lng}`).join(';');
    f.innerHTML = `<h3>${editing ? 'Edit' : 'Add'} facility</h3>
      <label>Name<input name="name" required value="${esc(r.name)}"></label>
      <label>Owner<select name="subActorId" ${editing ? 'disabled' : ''}><option value="">— none: a site of the account —</option>${state.subs.map((s) =>
        `<option value="${s.id}" ${r.subActorId === s.id ? 'selected' : ''}>${esc(s.firstName)} ${esc(s.lastName)}</option>`).join('')}</select></label>
      <label>Description<input name="description" value="${esc(r.description)}"></label>
      <div class="row"><label>Variety<input name="variety" value="${esc(r.variety)}"></label><label>Planted on<input name="plantedOn" type="date" value="${esc(r.plantedOn)}"></label></div>
      <div class="row"><label>Latitude<input name="latitude" type="number" step="any" value="${esc(r.latitude)}"></label><label>Longitude<input name="longitude" type="number" step="any" value="${esc(r.longitude)}"></label></div>
      <label>Outline (optional, 3+ points: lat,lng;lat,lng;lat,lng)<textarea name="outline" rows="2">${esc(outline)}</textarea></label>`;
  }
  f.insertAdjacentHTML('beforeend', `<div class="error" id="err"></div><div class="actions-row"><button type="button" class="link" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>`);
  $('#cancel').onclick = () => $('#dlg').close();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    for (const k of Object.keys(d)) if (d[k] === '') d[k] = null;
    const base = `/accounts/${state.account}/${state.tab === 'sub' ? 'sub-actors' : 'facilities'}`;
    try {
      if (state.tab === 'fac') {
        for (const k of ['latitude', 'longitude']) if (d[k] != null) d[k] = Number(d[k]);
        d.outline = d.outline ? d.outline.split(';').map((p) => { const [lat, lng] = p.split(',').map(Number); return { lat, lng }; }) : null;
      }
      editing ? await api('PUT', `${base}/${record.id}`, d) : await api('POST', base, d);
      $('#dlg').close();
      await loadAccounts();
      await load();
    } catch (err) { $('#err').textContent = err.message; }
  };
  $('#dlg').showModal();
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.id) { state.account = t.dataset.id; await loadAccounts(); await load(); }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b === t)); await load(); }
  else if (t.id === 'add') openForm(null);
  else if (t.dataset.edit) openForm((state.tab === 'sub' ? state.subs : state.facs).find((x) => x.id === t.dataset.edit));
  else if (t.dataset.del && confirm('Delete ' + t.dataset.del + '?' + (state.tab === 'sub' ? ' Its facilities are deleted too.' : ''))) {
    await api('DELETE', `/accounts/${state.account}/${state.tab === 'sub' ? 'sub-actors' : 'facilities'}/${t.dataset.del}`);
    await loadAccounts(); await load();
  }
});

(async () => { await loadAccounts(); state.account = state.accounts[0].id; await loadAccounts(); await load(); })();
</script>
</body>
</html>
